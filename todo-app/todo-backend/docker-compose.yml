# Start your Node application using the new user
# Instead of:
# $env:MONGO_URL="mongodb://root:example@localhost:3456/the_database?authSource=admin"; npm run dev
# Use:
# $env:MONGO_URL="mongodb://the_username:the_password@localhost:3456/the_database"; npm run dev
# The application is now using the normal database user, not the MongoDB superuser.

